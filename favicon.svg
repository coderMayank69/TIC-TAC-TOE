<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#5177c9"/>
  <g stroke="#fff" stroke-width="3" fill="none">
    <!-- Grid lines -->
    <line x1="33" y1="10" x2="33" y2="90"/>
    <line x1="67" y1="10" x2="67" y2="90"/>
    <line x1="10" y1="33" x2="90" y2="33"/>
    <line x1="10" y1="67" x2="90" y2="67"/>
    
    <!-- X and O samples -->
    <g stroke="#ff6b6b" stroke-width="4">
      <circle cx="25" cy="25" r="8"/>
    </g>
    <g stroke="#4ecdc4" stroke-width="4">
      <line x1="58" y1="16" x2="76" y2="34"/>
      <line x1="76" y1="16" x2="58" y2="34"/>
    </g>
  </g>
</svg>